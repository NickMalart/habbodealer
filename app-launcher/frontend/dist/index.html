<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><title>App Launcher</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0e1219;color:#c9d1d9;display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:12px 16px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:10px}
header h1{font-size:14px;font-weight:600;color:#e6edf3;flex:1}
.btn{padding:5px 12px;border-radius:6px;border:1px solid #30363d;font-size:12px;cursor:pointer;transition:background .15s}
.btn-primary{background:#238636;border-color:#2ea043;color:#fff}.btn-primary:hover:not(:disabled){background:#2ea043}
.btn-secondary{background:#21262d;color:#c9d1d9}.btn-secondary:hover:not(:disabled){background:#30363d}
.btn-blue{background:#1f6feb;border-color:#388bfd;color:#fff}.btn-blue:hover:not(:disabled){background:#388bfd}
.btn:disabled{opacity:.45;cursor:not-allowed}
.apps{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.app-row{display:flex;align-items:center;gap:8px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:8px 12px}
.app-row.missing{opacity:.55}
.app-name{flex:1;font-size:13px;font-weight:500}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.badge-running{background:#1a4721;color:#3fb950;border:1px solid #2ea043}
.badge-ready{background:#1f2d1a;color:#56d364;border:1px solid #2ea043}
.badge-missing{background:#3a1c1c;color:#f85149;border:1px solid #da3633}
.log-panel{height:190px;border-top:1px solid #30363d;background:#0d1117;display:flex;flex-direction:column}
.log-header{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#161b22;border-bottom:1px solid #30363d}
.log-header span{font-size:11px;color:#8b949e;flex:1}
#log{flex:1;overflow-y:auto;padding:6px 10px;font-family:Consolas,monospace;font-size:11px;line-height:1.55}
.log-info{color:#8b949e}.log-error{color:#f85149}.log-success{color:#3fb950}
#status{font-size:11px;color:#8b949e;padding:0 16px 6px;min-height:18px}
</style></head><body>
<header><h1>App Launcher</h1>
  <button class="btn btn-secondary" id="btnRefresh" onclick="refresh()">&#x21BA; Refresh</button>
  <button class="btn btn-blue" id="btnBuildAll" onclick="buildAll()">&#x2699; Build All</button>
</header>
<div class="apps" id="appList">Loading&#x2026;</div>
<div id="status"></div>
<div class="log-panel"><div class="log-header"><span>Build Log</span>
  <button class="btn btn-secondary" style="padding:2px 8px;font-size:11px" onclick="clearLog()">Clear</button>
</div><div id="log"></div></div>
<script>
const { BuildAll, BuildSingle, GetApps, LaunchApp, RefreshApps, IsBuilding } = window['go']['main']['App'];
const { EventsOn } = window['runtime'];
let building = false;
function setBuilding(v){building=v;document.getElementById('btnBuildAll').disabled=v;document.querySelectorAll('.btn-build').forEach(b=>b.disabled=v);document.querySelectorAll('.btn-open').forEach(b=>{const r=b.closest('.app-row');if(r)b.disabled=v||r.dataset.missing==='1'||r.dataset.running==='1';});}
function log(line,kind){const el=document.getElementById('log');const d=document.createElement('div');d.className='log-'+(kind||'info');d.textContent=line;el.appendChild(d);el.scrollTop=el.scrollHeight;}
function clearLog(){document.getElementById('log').innerHTML='';}
function setStatus(msg){document.getElementById('status').textContent=msg;}
EventsOn('buildLog',data=>{log(data.line,data.kind);if(data.kind==='success'&&(data.line.includes('complete')||data.line.includes('done'))){setTimeout(()=>{setBuilding(false);setStatus('');refresh();},200);}});
async function refresh(){const apps=await RefreshApps();renderApps(apps);}
async function buildAll(){if(building)return;setBuilding(true);setStatus('Building all apps\u2026');clearLog();await BuildAll();}
async function buildSingle(id,name){if(building)return;setBuilding(true);setStatus('Building '+name+'\u2026');clearLog();await BuildSingle(id);}
async function launch(id){const r=await LaunchApp(id);setStatus(r==='ok'?'':r);setTimeout(refresh,300);}
function renderApps(apps){const el=document.getElementById('appList');if(!apps||apps.length===0){el.innerHTML='<div style="color:#8b949e;padding:16px;font-size:13px">No apps found.</div>';return;}el.innerHTML='';for(const app of apps){const row=document.createElement('div');row.className='app-row'+(app.exists?''':' missing');row.dataset.missing=app.exists?'0':'1';row.dataset.running=app.running?'1':'0';const nm=document.createElement('div');nm.className='app-name';nm.textContent=app.name;const badge=document.createElement('span');badge.className='badge '+(app.running?'badge-running':app.exists?'badge-ready':'badge-missing');badge.textContent=app.running?'running':app.exists?'ready':'not built';const bb=document.createElement('button');bb.className='btn btn-secondary btn-build';bb.textContent='\u2699 Build';bb.disabled=building;bb.onclick=()=>buildSingle(app.id,app.name);const bo=document.createElement('button');bo.className='btn btn-primary btn-open';bo.textContent='Open';bo.disabled=building||!app.exists||app.running;bo.onclick=()=>launch(app.id);row.appendChild(nm);row.appendChild(badge);row.appendChild(bb);row.appendChild(bo);el.appendChild(row);}}
(async()=>{const apps=await GetApps();renderApps(apps);const busy=await IsBuilding();if(busy)setBuilding(true);})();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Raffle Bot</title>
  <style>
    :root {
      --bg: #0d1c24;
      --panel: #132b36;
      --panel2: #10303f;
      --text: #e8f2f4;
      --muted: #b4c8ce;
      --accent: #ffc857;
      --ok: #62c370;
      --warn: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background: radial-gradient(circle at 15% 20%, #1c4457 0%, var(--bg) 40%),
                  radial-gradient(circle at 85% 75%, #2c1f34 0%, rgba(44,31,52,0) 36%);
      min-height: 100vh;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 14px;
    }
    .card {
      background: linear-gradient(130deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)), var(--panel);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .title { font-size: 24px; margin: 0 0 4px; }
    .sub { margin: 0; color: var(--muted); }
    .status {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--panel2);
      border: 1px solid rgba(255,255,255,0.14);
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #1f1f1f;
    }
    button.alt { background: #8ab6c9; }
    button.stop { background: var(--warn); color: #fff; }
    input[type="number"] {
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 8px;
      width: 90px;
      background: #0b1b22;
      color: var(--text);
    }
    input[type="datetime-local"] {
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      padding: 8px;
      background: #0b1b22;
      color: var(--text);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); }
    .tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: #355a68;
      color: #eaf3f6;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .tab-btn.active {
      background: var(--accent);
      color: #1f1f1f;
      border-color: transparent;
    }
    .hidden { display: none; }
    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0b1b22;
      color: var(--text);
      padding: 10px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="title">Free Raffle Bot</h1>
      <p class="sub">Adds 1 ticket on first bet, then +1 ticket every Nth bet.</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button id="tabMainBtn" class="tab-btn active">Main</button>
        <button id="tabDebugBtn" class="tab-btn">Debug</button>
      </div>
    </div>

    <div class="card tab-main">
      <div class="row" style="justify-content: space-between;">
        <div class="row">
          <span class="status" id="connected">Disconnected</span>
          <span class="status" id="room">Out of room</span>
          <span class="status" id="enabled">Disabled</span>
        </div>
        <div class="row">
          <label for="bonus">Bonus every</label>
          <input id="bonus" type="number" min="1" value="5">
          <button class="alt" id="saveBonus">Save Bonus Rule</button>
        </div>
      </div>
      <div class="row" style="margin-top: 12px;">
        <button id="enableBtn">Enable</button>
        <button class="alt" id="sessionBtn">Start Raffle Session</button>
        <button class="alt" id="refreshBtn">Refresh</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <label for="startAt">Raffle start</label>
        <input id="startAt" type="datetime-local">
        <label for="endAt">Raffle end</label>
        <input id="endAt" type="datetime-local">
      </div>
    </div>

    <div class="card tab-main">
      <div class="row" style="justify-content: space-between;">
        <h2 style="margin: 0;">Current Session</h2>
        <span class="muted" id="sessionMeta">No active session</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th>Bets</th>
            <th>Tickets</th>
            <th>Last Bet</th>
          </tr>
        </thead>
        <tbody id="participants">
          <tr><td colspan="4" class="muted">No participants yet.</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card tab-debug hidden" id="debugCard">
      <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
        <h2 style="margin: 0;">Debug</h2>
        <div class="row">
          <button class="alt" id="refreshDebugBtn">Refresh Debug</button>
          <button class="alt" id="copyDebugBtn">Copy Debug</button>
          <button class="stop" id="clearDebugBtn">Clear Debug</button>
        </div>
      </div>
      <textarea id="debugBox" placeholder="Debug output appears here..."></textarea>
      <p class="sub" style="margin-top: 8px;">Use Copy Debug and paste it into chat when troubleshooting.</p>
    </div>
  </div>

  <script>
    async function call(name, ...args) {
      if (!window.go || !window.go.main || !window.go.main.App || !window.go.main.App[name]) {
        return null;
      }
      return window.go.main.App[name](...args);
    }

    function setStatus(state) {
      const connected = document.getElementById('connected');
      const room = document.getElementById('room');
      const enabled = document.getElementById('enabled');
      connected.textContent = state.connected ? 'Connected' : 'Disconnected';
      room.textContent = state.inRoom ? 'In room' : 'Out of room';
      enabled.textContent = state.enabled ? 'Enabled' : 'Disabled';

      const meta = document.getElementById('sessionMeta');
      const sessionBtn = document.getElementById('sessionBtn');
      if (state.currentSession) {
        const endInfo = state.currentSession.scheduledEndAt ? `, ends ${state.currentSession.scheduledEndAt}` : ', no end set';
        const closeInfo = state.currentSession.endedAt ? `, closed ${state.currentSession.endedAt}` : '';
        meta.textContent = `Session #${state.currentSession.id} starts ${state.currentSession.startedAt}${endInfo}${closeInfo} (bonus every ${state.currentSession.bonusEvery})`;
        sessionBtn.textContent = 'Stop Session';
        sessionBtn.className = 'stop';
      } else {
        meta.textContent = 'No active session';
        sessionBtn.textContent = 'Start Raffle Session';
        sessionBtn.className = 'alt';
      }

      const bonusInput = document.getElementById('bonus');
      if (state.bonusEvery > 0 && document.activeElement !== bonusInput) {
        bonusInput.value = state.bonusEvery;
      }

      const tbody = document.getElementById('participants');
      tbody.innerHTML = '';
      const list = state.currentSession ? state.currentSession.participants || [] : [];
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="muted">No participants yet.</td></tr>';
        return;
      }
      for (const p of list) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${p.username}</td><td>${p.betCount}</td><td>${p.tickets}</td><td>${p.lastBet || ''}</td>`;
        tbody.appendChild(tr);
      }

      const enableBtn = document.getElementById('enableBtn');
      enableBtn.textContent = state.enabled ? 'Disable' : 'Enable';
    }

    async function refresh() {
      const state = await call('GetState');
      if (state) setStatus(state);
    }

    async function refreshDebug() {
      const txt = await call('GetDebugSnapshot');
      if (typeof txt === 'string') {
        document.getElementById('debugBox').value = txt;
      }
    }

    function showTab(name) {
      const showDebug = name === 'debug';
      document.querySelectorAll('.tab-main').forEach(el => el.classList.toggle('hidden', showDebug));
      document.querySelectorAll('.tab-debug').forEach(el => el.classList.toggle('hidden', !showDebug));
      document.getElementById('tabMainBtn').classList.toggle('active', !showDebug);
      document.getElementById('tabDebugBtn').classList.toggle('active', showDebug);
      if (showDebug) {
        refreshDebug();
      }
    }

    async function copyDebugToClipboard() {
      const txt = document.getElementById('debugBox').value || '';
      if (!txt.trim()) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(txt);
        } else {
          const ta = document.getElementById('debugBox');
          ta.focus();
          ta.select();
          document.execCommand('copy');
        }
      } catch (_) {
      }
    }

    function bindRealtimeEvents() {
      if (!window.runtime || !window.runtime.EventsOn) {
        return;
      }

      window.runtime.EventsOn('raffleStateUpdate', (state) => {
        if (state) {
          setStatus(state);
        }
      });

      window.runtime.EventsOn('raffleDebugUpdate', (snapshot) => {
        if (typeof snapshot === 'string') {
          document.getElementById('debugBox').value = snapshot;
        }
      });
    }

    function localInputToISO(id) {
      const raw = (document.getElementById(id).value || '').trim();
      if (!raw) return '';
      const d = new Date(raw);
      if (Number.isNaN(d.getTime())) return '';
      return d.toISOString();
    }

    function setDefaultDateTimes() {
      const start = new Date();
      const end = new Date(start.getTime() + 60 * 60 * 1000);
      const toLocalField = (d) => {
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
      };
      const startInput = document.getElementById('startAt');
      const endInput = document.getElementById('endAt');
      if (!startInput.value) startInput.value = toLocalField(start);
      if (!endInput.value) endInput.value = toLocalField(end);
    }

    document.getElementById('enableBtn').addEventListener('click', async () => {
      const state = await call('GetState');
      await call('SetEnabled', !(state && state.enabled));
      await refresh();
    });

    document.getElementById('saveBonus').addEventListener('click', async () => {
      const value = parseInt(document.getElementById('bonus').value || '5', 10);
      await call('SetBonusEvery', value > 0 ? value : 5);
      await refresh();
    });

    document.getElementById('sessionBtn').addEventListener('click', async () => {
      const state = await call('GetState');
      if (state && state.currentSession) {
        await call('StopRaffle');
        await refresh();
        return;
      }
      try {
        const startISO = localInputToISO('startAt');
        const endISO = localInputToISO('endAt');
        await call('StartRaffleWithWindow', startISO, endISO);
        await refresh();
      } catch (err) {
        alert(`Could not start raffle: ${err}`);
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', refresh);
    document.getElementById('refreshDebugBtn').addEventListener('click', refreshDebug);
    document.getElementById('copyDebugBtn').addEventListener('click', copyDebugToClipboard);
    document.getElementById('clearDebugBtn').addEventListener('click', async () => {
      await call('ClearDebugSnapshot');
      await refreshDebug();
    });
    document.getElementById('tabMainBtn').addEventListener('click', () => showTab('main'));
    document.getElementById('tabDebugBtn').addEventListener('click', () => showTab('debug'));

    setDefaultDateTimes();
    bindRealtimeEvents();
    refresh();
    refreshDebug();
    setInterval(refresh, 8000);
    setInterval(refreshDebug, 10000);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Tracker</title>
  <style>
    :root {
      --bg: #121920;
      --panel: #1b2632;
      --text: #e9f2fa;
      --muted: #95a8bb;
      --accent: #53c6ff;
      --good: #2cc783;
      --warn: #f4b860;
      --danger: #ef6a6a;
      --border: #2e3d4c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 12%, #233347 0%, transparent 42%),
        radial-gradient(circle at 82% 78%, #1c2d3f 0%, transparent 40%),
        var(--bg);
      min-height: 100vh;
      padding: 12px;
    }

    .shell {
      max-width: 920px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .card {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #1f2b37 0%, #17212b 100%);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      color: var(--accent);
      letter-spacing: 0.4px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
      color: #061018;
      transition: transform 110ms ease, filter 110ms ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.99); }

    .start { background: linear-gradient(90deg, #59d2ff, #2cc783); }
    .stop { background: linear-gradient(90deg, #f6c868, #ef6a6a); }
    .clear { background: linear-gradient(90deg, #8ea2b7, #6d8094); color: #eef5fb; }

    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: #111922;
    }

    .ok { color: #8ee7be; border-color: #2f6f52; }
    .bad { color: #f1a6a6; border-color: #7a3e3e; }
    .run { color: #b6f0d3; border-color: #2f6f52; }
    .idle { color: #e8d3a2; border-color: #7b6439; }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .list {
      max-height: 300px;
      overflow: auto;
      padding-right: 4px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px;
      margin-bottom: 8px;
      background: #121b24;
    }

    .item.clickable {
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .item.clickable:hover {
      border-color: #3f566c;
      background: #162330;
    }

    .item.active {
      border-color: var(--accent);
      background: #172737;
    }

    .item strong {
      color: #f2fbff;
    }

    .tiny {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-all;
    }

    .items {
      margin-top: 8px;
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }

    .items .line {
      font-size: 12px;
      color: #d9ebfa;
      margin-bottom: 4px;
    }

    .section-title {
      margin-top: 10px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .empty {
      font-size: 13px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      background: #101822;
    }

    @media (max-width: 860px) {
      .columns { grid-template-columns: 1fr; }
      .list { max-height: 260px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <h1>Trade Tracker</h1>
      <div class="muted">Record incoming trades in timestamped sessions.</div>
      <div class="row">
        <span id="conn" class="badge bad">Not connected</span>
        <span id="run" class="badge idle">Idle</span>
      </div>
      <div class="row">
        <button id="toggle" class="start">Start Trade Tracker</button>
        <button id="clear" class="clear">Clear Saved Sessions</button>
      </div>
    </div>

    <div class="columns">
      <div class="card">
        <h1 style="font-size:16px">Current Session</h1>
        <div id="currentMeta" class="muted">No active session.</div>
        <div id="currentList" class="list"></div>
      </div>

      <div class="card">
        <h1 style="font-size:16px">History</h1>
        <div id="pastList" class="list"></div>
        <div class="section-title">Selected Session Trades</div>
        <div id="historyMeta" class="muted">Pick a session to inspect trades.</div>
        <div id="historyTrades" class="list"></div>
        <div class="section-title">Selected Trade Details</div>
        <div id="tradeDetail" class="list"></div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      connected: false,
      running: false,
      currentSession: null,
      sessions: []
    };

    const connEl = document.getElementById("conn");
    const runEl = document.getElementById("run");
    const currentMetaEl = document.getElementById("currentMeta");
    const currentListEl = document.getElementById("currentList");
    const pastListEl = document.getElementById("pastList");
    const toggleEl = document.getElementById("toggle");
    const historyMetaEl = document.getElementById("historyMeta");
    const historyTradesEl = document.getElementById("historyTrades");
    const tradeDetailEl = document.getElementById("tradeDetail");

    let selectedSessionId = null;
    let selectedTradeKey = null;

    function backend() {
      return window.go && window.go.main && window.go.main.App;
    }

    function applyBadge(el, text, css) {
      el.textContent = text;
      el.className = "badge " + css;
    }

    function renderCurrent() {
      const s = state.currentSession;
      if (!s) {
        currentMetaEl.textContent = "No active session.";
        currentListEl.innerHTML = '<div class="empty">Start tracker to record new trades.</div>';
        return;
      }

      currentMetaEl.textContent = "Session #" + s.id + " started at " + s.startedAt + " | entries: " + (s.entries || []).length;

      const rows = (s.entries || []).map((e) => {
        return [
          '<div class="item">',
          '<strong>' + escapeHtml(e.partnerName || "Unknown") + '</strong> <span class="tiny">(trade id: ' + (e.partnerTradeId || 0) + ')</span>',
          '<div class="tiny">At: ' + escapeHtml(e.timestamp || "") + '</div>',
          '<div class="tiny">Payload: ' + escapeHtml(e.payloadHex || "") + '</div>',
          '</div>'
        ].join("");
      }).reverse();

      currentListEl.innerHTML = rows.length ? rows.join("") : '<div class="empty">Waiting for incoming trades...</div>';
    }

    function getSessionById(id) {
      const sessions = state.sessions || [];
      return sessions.find((s) => Number(s.id) === Number(id)) || null;
    }

    function renderHistoryDetails() {
      const selected = selectedSessionId != null ? getSessionById(selectedSessionId) : null;
      if (!selected) {
        historyMetaEl.textContent = "Pick a session to inspect trades.";
        historyTradesEl.innerHTML = '<div class="empty">No session selected.</div>';
        tradeDetailEl.innerHTML = '<div class="empty">Choose a trade to see partner, time, and items.</div>';
        return;
      }

      const entries = (selected.entries || []).slice().reverse();
      historyMetaEl.textContent = "Session #" + selected.id + " | Trades: " + entries.length;

      historyTradesEl.innerHTML = entries.length
        ? entries.map((e, idx) => {
            const key = selected.id + ":" + (e.timestamp || "") + ":" + idx;
            const active = selectedTradeKey === key ? " active" : "";
            return [
              '<div class="item clickable' + active + '" data-trade-key="' + escapeHtml(key) + '">',
              '<strong>' + escapeHtml(e.partnerName || "Unknown") + '</strong>',
              '<div class="tiny">At: ' + escapeHtml(e.timestamp || "") + '</div>',
              '<div class="tiny">Trade ID: ' + escapeHtml(String(e.partnerTradeId || 0)) + '</div>',
              '</div>'
            ].join("");
          }).join("")
        : '<div class="empty">No trades in this session.</div>';

      historyTradesEl.querySelectorAll(".item.clickable").forEach((el) => {
        el.addEventListener("click", () => {
          selectedTradeKey = el.getAttribute("data-trade-key");
          renderHistoryDetails();
        });
      });

      let selectedEntry = null;
      if (selectedTradeKey) {
        for (let i = 0; i < entries.length; i += 1) {
          const key = selected.id + ":" + (entries[i].timestamp || "") + ":" + i;
          if (key === selectedTradeKey) {
            selectedEntry = entries[i];
            break;
          }
        }
      }

      if (!selectedEntry) {
        tradeDetailEl.innerHTML = '<div class="empty">Choose a trade to see exact items for that time.</div>';
        return;
      }

      const items = selectedEntry.furniItems || [];
      const itemRows = items.length
        ? items.map((it) => '<div class="line">' + escapeHtml(it.name || "") + ' x' + escapeHtml(String(it.quantity || 1)) + '</div>').join("")
        : '<div class="line">No item details captured.</div>';

      tradeDetailEl.innerHTML = [
        '<div class="item">',
        '<strong>' + escapeHtml(selectedEntry.partnerName || "Unknown") + '</strong>',
        '<div class="tiny">At: ' + escapeHtml(selectedEntry.timestamp || "") + '</div>',
        '<div class="tiny">Trade ID: ' + escapeHtml(String(selectedEntry.partnerTradeId || 0)) + '</div>',
        '<div class="items">' + itemRows + '</div>',
        '</div>'
      ].join("");
    }

    function renderPast() {
      const sessions = state.sessions || [];
      if (!sessions.length) {
        pastListEl.innerHTML = '<div class="empty">No saved sessions yet.</div>';
        selectedSessionId = null;
        selectedTradeKey = null;
        renderHistoryDetails();
        return;
      }

      const rows = sessions.map((s) => {
        const active = Number(selectedSessionId) === Number(s.id) ? " active" : "";
        return [
          '<div class="item clickable' + active + '" data-session-id="' + s.id + '">',
          '<strong>Session #' + s.id + '</strong>',
          '<div class="tiny">Start: ' + escapeHtml(s.startedAt || "") + '</div>',
          '<div class="tiny">End: ' + escapeHtml(s.endedAt || "") + '</div>',
          '<div class="tiny">Trades: ' + ((s.entries || []).length) + '</div>',
          '</div>'
        ].join("");
      }).reverse();

      pastListEl.innerHTML = rows.join("");

      if (selectedSessionId == null && sessions.length) {
        selectedSessionId = sessions[sessions.length - 1].id;
      }

      pastListEl.querySelectorAll(".item.clickable").forEach((el) => {
        el.addEventListener("click", () => {
          selectedSessionId = Number(el.getAttribute("data-session-id"));
          selectedTradeKey = null;
          renderPast();
        });
      });

      renderHistoryDetails();
    }

    function applyUI() {
      applyBadge(connEl, state.connected ? "Connected" : "Not connected", state.connected ? "ok" : "bad");
      applyBadge(runEl, state.running ? "Tracking" : "Idle", state.running ? "run" : "idle");

      toggleEl.textContent = state.running ? "Stop Trade Tracker" : "Start Trade Tracker";
      toggleEl.className = state.running ? "stop" : "start";

      renderCurrent();
      renderPast();
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function pullState() {
      const api = backend();
      if (!api || !api.GetState) {
        return;
      }
      const next = await api.GetState();
      Object.assign(state, next || {});
      applyUI();
    }

    async function startTracking() {
      const api = backend();
      if (!api || !api.StartTracking) {
        return;
      }
      const next = await api.StartTracking();
      Object.assign(state, next || {});
      applyUI();
    }

    async function stopTracking() {
      const api = backend();
      if (!api || !api.StopTracking) {
        return;
      }
      const next = await api.StopTracking();
      Object.assign(state, next || {});
      applyUI();
    }

    async function toggleTracking() {
      if (state.running) {
        await stopTracking();
      } else {
        await startTracking();
      }
    }

    async function clearSessions() {
      const api = backend();
      if (!api || !api.ClearSessions) {
        return;
      }
      const next = await api.ClearSessions();
      Object.assign(state, next || {});
      applyUI();
    }

    document.getElementById("toggle").addEventListener("click", toggleTracking);
    document.getElementById("clear").addEventListener("click", clearSessions);

    setInterval(pullState, 1000);

    window.addEventListener("load", async () => {
      await pullState();
      if (window.runtime && window.runtime.EventsOn) {
        window.runtime.EventsOn("trackerStateUpdate", (next) => {
          Object.assign(state, next || {});
          applyUI();
        });
      }
    });
  </script>
</body>
</html>
